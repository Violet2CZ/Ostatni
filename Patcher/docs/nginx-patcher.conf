# Vlož do bloku server { } svého webu (violet2.cz) v nginx.conf, PŘED blok  location ~ \.php$ { ... }
# Složka na VPS: /usr/local/www/web/patcher/   (manifest.json, manifest.sig, files/...)
location = /patcher/manifest.json { alias /usr/local/www/web/patcher/manifest.json; add_header Cache-Control "no-cache"; default_type application/json; }
location = /patcher/manifest.sig  { alias /usr/local/www/web/patcher/manifest.sig;  add_header Cache-Control "no-cache"; default_type text/plain; }
location ^~ /patcher/ {
    alias /usr/local/www/web/patcher/;
    autoindex off;                       # nikdo si nevylistuje obsah složky
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff;
    add_header Content-Disposition attachment;
    # soubory z této složky se nikdy nespouštějí jako PHP (^~ vypíná regex bloky)
}
